<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Машули! ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fef6f6 0%, #fde2e4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #4a5568;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.2s ease-out forwards;
        }
        h1 {
            color: #ff5c8a;
            font-size: 2.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #6c757d;
        }
        .gift-box {
            font-size: 5.5rem;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            animation: bounce 2s infinite;
            user-select: none;
        }
        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }
        .certificate-wrapper {
            display: none;
            opacity: 0;
            transform: scale(0.9);
            animation: showCert 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            margin-top: 20px;
        }
        .certificate-img {
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 4px solid white;
        }
        .download-btn {
            display: inline-block;
            margin-top: 25px;
            background: #ff5c8a;
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(255, 92, 138, 0.4);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            background: #ff477e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 92, 138, 0.6);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }
        @keyframes showCert {
            to { opacity: 1; transform: scale(1); }
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 999;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
       <source src="allegrova.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>С Днем Рождения! 🎉</h1>
        <p>Машуля, ты красотка! Желаем любви офигенной, счастья, успехов, денег, активов, путешествий и исполнения желаний! Твой главный сюрприз спрятан внутри коробки. Скорее жми на нее!</p>
        
        <div class="gift-box" id="gift" onclick="openGift()">🎁</div>
        
        <div class="certificate-wrapper" id="certWrapper">
            <img src="certificate.png" alt="Электронный сертификат" class="certificate-img">
            <br>
            <a href="certificate.png" download="Мой_Подарок.png" class="download-btn">Скачать подарок 💝</a>
        </div>
    </div>

    <script>
        function openGift() {
            const audio = document.getElementById('bgMusic');
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Ошибка аудио:", e));

            document.getElementById('gift').style.display = 'none';
            document.getElementById('certWrapper').style.display = 'block';
            
            for(let i = 0; i < 70; i++) {
                createConfetti();
            }
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
            confetti.style.backgroundColor = ['#ff5c8a','#ff7096','#ff85a1','#fbb1bd','#f9bec7','#ffe5ec','#ffd166'][Math.floor(Math.random() * 7)];
            confetti.style.transform = `scale(${Math.random() * 0.8 + 0.5})`;
            if (Math.random() > 0.5) {
                confetti.style.borderRadius = '50%';
            }
            document.body.appendChild(confetti);
            setTimeout(() => { confetti.remove(); }, 3500);
        }
    </script>
</body>
</html>
